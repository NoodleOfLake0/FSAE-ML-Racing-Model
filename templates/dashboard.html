<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VT FSAE RL Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0d1117;
            color: #e6edf3;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 36px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 5px;
            color: #8b949e;
            font-size: 14px;
        }

        .status {
            padding: 8px 14px;
            border-radius: 20px;

            background: #16351f;
            color: #3fb950;

            font-size: 13px;
            font-weight: 600;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 16px;
        }

        .card {
            background: #161b22;

            border: 1px solid #30363d;
            border-radius: 12px;

            padding: 20px;
        }

        .label {
            color: #8b949e;
            font-size: 13px;

            margin-bottom: 8px;
        }

        .value {
            font-size: 28px;
            font-weight: 650;
        }

        .small-value {
            font-size: 21px;
            font-weight: 600;
        }

        .wide {
            grid-column: span 3;
        }

        .bar-wrapper {
            margin-top: 10px;

            height: 9px;

            background: #30363d;

            border-radius: 10px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;

            background: #58a6ff;

            border-radius: 10px;

            transition: width 0.15s ease;
        }

        .controls {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;
        }

        .control-value {
            display: flex;
            justify-content: space-between;

            font-size: 14px;
        }

        .center-bar {
            position: relative;

            margin-top: 12px;
            height: 9px;

            background: #30363d;
            border-radius: 10px;
        }

        .center-line {
            position: absolute;

            left: 50%;
            top: -3px;

            width: 1px;
            height: 15px;

            background: #8b949e;
        }

        .indicator {
            position: absolute;

            top: -4px;

            width: 5px;
            height: 17px;

            background: #58a6ff;

            border-radius: 4px;

            left: 50%;

            transition: left 0.08s linear;
        }

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: span 1;
            }

            .controls {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <div>
            <div class="title">
                VT FSAE RL Training
            </div>

            <div class="subtitle">
                MuJoCo + Gymnasium + PPO
            </div>
        </div>

        <div
            class="status"
            id="connection-status"
        >
            LIVE
        </div>

    </div>


    <div class="grid">

        <div class="card">

            <div class="label">
                Episode
            </div>

            <div
                class="value"
                id="episode"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                Total Steps
            </div>

            <div
                class="value"
                id="total-steps"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                Episode Step
            </div>

            <div
                class="value"
                id="episode-step"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                Current Reward
            </div>

            <div
                class="small-value"
                id="reward"
            >
                0.0000
            </div>

        </div>


        <div class="card">

            <div class="label">
                Speed
            </div>

            <div
                class="small-value"
                id="speed"
            >
                0.0000
            </div>

        </div>


        <div class="card">

            <div class="label">
                Track Distance
            </div>

            <div
                class="small-value"
                id="track-distance"
            >
                0.0000
            </div>

        </div>


        <div class="card wide">

            <div class="label">
                Course Progress
            </div>

            <div
                class="small-value"
                id="waypoint"
            >
                0 / 0
            </div>

            <div class="bar-wrapper">

                <div
                    class="bar"
                    id="waypoint-bar"
                ></div>

            </div>

        </div>


        <div class="card wide">

            <div class="controls">


                <div>

                    <div class="control-value">

                        <span>Throttle</span>

                        <span id="throttle">
                            +0.000
                        </span>

                    </div>

                    <div class="center-bar">

                        <div class="center-line"></div>

                        <div
                            class="indicator"
                            id="throttle-indicator"
                        ></div>

                    </div>

                </div>


                <div>

                    <div class="control-value">

                        <span>Steering</span>

                        <span id="steering">
                            +0.000
                        </span>

                    </div>

                    <div class="center-bar">

                        <div class="center-line"></div>

                        <div
                            class="indicator"
                            id="steering-indicator"
                        ></div>

                    </div>

                </div>


            </div>

        </div>


    </div>

</div>


<script>

    async function updateDashboard() {

        try {

            const response = await fetch(
                "/api/status",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data = await response.json();


            document.getElementById(
                "episode"
            ).textContent =
                data.episode ?? 0;


            document.getElementById(
                "total-steps"
            ).textContent =
                (data.total_steps ?? 0)
                .toLocaleString();


            document.getElementById(
                "episode-step"
            ).textContent =
                data.episode_step ?? 0;


            document.getElementById(
                "reward"
            ).textContent =
                Number(
                    data.reward ?? 0
                ).toFixed(4);


            document.getElementById(
                "speed"
            ).textContent =
                Number(
                    data.speed ?? 0
                ).toFixed(4);


            document.getElementById(
                "track-distance"
            ).textContent =
                Number(
                    data.track_distance ?? 0
                ).toFixed(4);


            const waypoint =
                data.waypoint ?? 0;

            const totalWaypoints =
                data.total_waypoints ?? 0;


            document.getElementById(
                "waypoint"
            ).textContent =
                `${waypoint} / ${totalWaypoints}`;


            let progress = 0;

            if (totalWaypoints > 0) {

                progress =
                    (
                        waypoint /
                        totalWaypoints
                    ) * 100;

            }


            document.getElementById(
                "waypoint-bar"
            ).style.width =
                `${progress}%`;


            const throttle =
                Number(
                    data.throttle ?? 0
                );

            const steering =
                Number(
                    data.steering ?? 0
                );


            document.getElementById(
                "throttle"
            ).textContent =
                throttle.toFixed(3);


            document.getElementById(
                "steering"
            ).textContent =
                steering.toFixed(3);


            // -1 ... +1
            // becomes
            // 0% ... 100%

            document.getElementById(
                "throttle-indicator"
            ).style.left =
                `${(throttle + 1) * 50}%`;


            document.getElementById(
                "steering-indicator"
            ).style.left =
                `${(steering + 1) * 50}%`;


            const status =
                document.getElementById(
                    "connection-status"
                );


            if (data.waiting) {

                status.textContent =
                    "WAITING";

            } else {

                status.textContent =
                    "LIVE";

            }

        }

        catch (error) {

            document.getElementById(
                "connection-status"
            ).textContent =
                "DISCONNECTED";

        }

    }


    // Refresh 4 times / second.
    updateDashboard();

    setInterval(
        updateDashboard,
        250
    );

</script>

</body>
</html>
